# Dung client JX1 (S3Client) bang VS2022 tren runner Windows.
# Muc dich: chung minh cay source build duoc. Chay tung buoc, KHONG dung o loi dau,
# de mot lan chay cho biet het cho nao gay.
name: build-client

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-client.yml'
      - '.github/scripts/**'

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    env:
      SRC: ClientAnti_JX1\SwordOnline\Sources

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Moi truong
        run: |
          echo === danh sach VS ===
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion
          echo === toolset v143 co san? ===
          dir "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" 2>nul || dir "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          echo === cay source ===
          dir %SRC%

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Va nguon cho trinh dich hien dai
        shell: bash
        run: python .github/scripts/port-fixes.py .

      - name: Dat co tuong thich va duong include
        run: |
          rem MSBuild dung IncludePath cua project de dung moi truong cho cl.exe, nen bien
          rem INCLUDE cua shell bi bo qua. Bien CL thi cl.exe tu doc va them vao dau -> dung duoc.
          rem /Zc:forScope- : tra lai pham vi bien cua for kieu cu (for(int i..) roi dung lai i)
          rem Cac project khong khai bao duong thu vien day du (Engine can common.lib o Lib/).
          rem link.exe tu doc bien LIB, giong cach cl.exe doc CL.
          echo LIB=%CD%\ClientAnti_JX1\SwordOnline\Lib;%CD%\ClientAnti_JX1\SwordOnline\Lib\Release;%LIB%>> %GITHUB_ENV%
          echo CL=/I"%CD%\%SRC%" /I"%CD%\%SRC%\Engine\Src" /I"%CD%\%SRC%\Engine\Include" /I"%CD%\%SRC%\Core\Src" /I"%CD%\ClientAnti_JX1\SwordOnline\Headers">> %GITHUB_ENV%

      - name: Kiem thu vien da dung san
        run: |
          echo === ClientAnti_JX1\SwordOnline\Lib ===
          dir ClientAnti_JX1\SwordOnline\Lib
          echo === kiem magic cua .lib (phai la "!<arch>") ===
          powershell -Command "Get-ChildItem 'ClientAnti_JX1\SwordOnline\Lib\*.lib' | ForEach-Object { $b=[System.IO.File]::ReadAllBytes($_.FullName)[0..7]; $s=-join($b|%%{[char]$_}); Write-Host ('{0,-32} {1,10} bytes  magic=[{2}]' -f $_.Name,$_.Length,$s) }"

      # Engine va Core phu thuoc VONG: nguon Engine co #pragma comment(lib,"CoreClient.lib")
      # con Core lai can Engine.lib. Vi vay phai build hai luot: luot 1 dung .lib dung san
      # tu 2013 de co ban moi, luot 2 dung ban moi de co ban dung.
      - name: 'Build Engine (Release|Win32)'
        id: engine
        continue-on-error: true
        run: msbuild "%SRC%\Engine\Engine.vcxproj" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m /v:minimal /fl /flp:logfile=engine.log;verbosity=normal

      - name: 'Build Core (Client Release|Win32)'
        id: core
        continue-on-error: true
        env:
          CL: /FI"msvc-compat.h" /I"${{ github.workspace }}\ClientAnti_JX1\SwordOnline\Sources" /I"${{ github.workspace }}\ClientAnti_JX1\SwordOnline\Sources\Engine\Src" /I"${{ github.workspace }}\ClientAnti_JX1\SwordOnline\Sources\Engine\Include" /I"${{ github.workspace }}\ClientAnti_JX1\SwordOnline\Sources\Core\Src" /I"${{ github.workspace }}\ClientAnti_JX1\SwordOnline\Headers"
        run: msbuild "%SRC%\Core\Core.vcxproj" /p:Configuration="Client Release" /p:Platform=Win32 /p:PlatformToolset=v143 /m /v:minimal /fl /flp:logfile=core.log;verbosity=normal

      # Ban FilterText_StaticLib.lib dung san nhung std::basic_string cua thu vien
      # chuan doi 2003 (cac ky hieu __declspec(dllimport) khong con ton tai trong
      # MSVC hien dai). Repo co san nguon nen dung lai de ca solution cung mot ABI.
      - name: 'Build FilterText_StaticLib (Release|Win32)'
        id: filtertext
        if: always()
        continue-on-error: true
        run: msbuild "%SRC%\FilterText\FilterText_StaticLib.vcxproj" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:ImageHasSafeExceptionHandlers=false /m /v:minimal /fl /flp:logfile=filtertext.log;verbosity=normal

      - name: 'Dua san pham Engine/Core vao Lib'
        if: always()
        continue-on-error: true
        run: |
          echo === Engine\Release ===
          dir "%SRC%\Engine\Release\*.lib" "%SRC%\Engine\Release\*.dll" 2>nul
          echo === Core\ClientRelease ===
          dir "%SRC%\Core\ClientRelease\*.lib" "%SRC%\Core\ClientRelease\*.dll" 2>nul
          for %%D in ("ClientAnti_JX1\SwordOnline\Lib" "ClientAnti_JX1\SwordOnline\Lib\Release") do (
            copy /Y "%SRC%\Engine\Release\Engine.lib" "%%~D\" 2>nul
            copy /Y "%SRC%\Engine\Release\Engine.dll" "%%~D\" 2>nul
            copy /Y "%SRC%\Core\ClientRelease\CoreClient.lib" "%%~D\" 2>nul
            copy /Y "%SRC%\Core\ClientRelease\CoreClient.dll" "%%~D\" 2>nul
            copy /Y "%SRC%\FilterText\FilterText_StaticLib___Win32_Release\FilterText_StaticLib.lib" "%%~D\" 2>nul
          )

      # Tang ve (Represent2 = DirectDraw, Represent3 = Direct3D). Client chon bang
      # config.ini [Client] Represent=2 hoac 3.
      #
      # Vi sao phai dung tu nguon: ban Represent2.dll dung san (doi 2012) goi
      # engine.dll.?Init@KDirectDraw@@QAEHXZ tuc Init() KHONG tham so, con nguon
      # trong kho nay khai BOOL Init(KDirectDraw*) — chu ky khac nen ten mangled
      # khac, Wine bao "unimplemented function" roi abort truoc khi mo cua so.
      # Do bang client tu build ngay 24/08/2026.
      #
      # Phai dat SAU buoc dua Engine.lib vao Lib, vi hai project nay can no.
      - name: 'Build Represent2 (Release^|Win32)'
        if: always()
        id: represent2
        continue-on-error: true
        # Da do vong truoc: LIB dat dung duong tuyet doi va common.lib co that
        # (4.953.460 byte) nhung van LNK1104. Nen khai thang duong tim thu vien
        # bang .props thay vi tin vao bien moi truong. Xem .github/msbuild/duong-thu-vien.props
        run: msbuild "%SRC%\Represent\Represent2\Represent2.vcxproj" /p:GenerateMapFile=true /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:ImageHasSafeExceptionHandlers=false /p:ForceImportBeforeCppTargets="%CD%\.github\msbuild\duong-thu-vien.props" /m /v:minimal /fl /flp:logfile=represent2.log;verbosity=normal

      # Represent3 (Direct3D) KHONG dung duoc: precompile.h can 'd3dx9.h' — thu vien
      # D3DX cua bo DirectX SDK cu, da bi go khoi Windows SDK tu lau va khong co
      # trong kho. Bo qua: config.ini cua ban dang doi chieu dat Represent=2.
      # Muon bat lai thi phai dua DirectX SDK (June 2010) vao runner truoc.

      # Rainbow.dll = tang noi mang cua client. S3Client/NetConnect/NetConnectAgent.cpp:21
      # LoadLibrary("Rainbow.dll") roi GetProcAddress(...,"CreateInterface").
      #
      # Vi sao phai dung tu nguon: ban rainbow.dll dung san (2012, 28.064 byte) khong lo
      # ten "CreateInterface" ra ngoai, nen GetProcAddress tra NULL va Initialize() that
      # bai — do bang chinh client tu build 25/08/2026, hop thoai
      # "Khoi tao module that bai: NetConnectAgent (ma 4)".
      # Nguon co san MultiServer/Rainbow/Rainbow.def khai EXPORTS CreateInterface @1.
      - name: 'Build Rainbow (Release^|Win32)'
        if: always()
        id: rainbow
        continue-on-error: true
        run: msbuild "%SRC%\MultiServer\Rainbow\Rainbow.vcxproj" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:ImageHasSafeExceptionHandlers=false /p:GenerateMapFile=true /p:ForceImportBeforeCppTargets="%CD%\.github\msbuild\duong-thu-vien.props" /m /v:minimal /fl /flp:logfile=rainbow.log;verbosity=normal

      - name: Build S3Client (Release^|Win32)
        if: always()
        id: s3client
        continue-on-error: true
        run: msbuild "%SRC%\S3Client\S3Client.vcxproj" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:ImageHasSafeExceptionHandlers=false /m /v:minimal /fl /flp:logfile=s3client.log;verbosity=normal

      - name: Tong ket
        if: always()
        run: |
          echo Engine     = ${{ steps.engine.outcome }}
          echo FilterText = ${{ steps.filtertext.outcome }}
          echo Core     = ${{ steps.core.outcome }}
          echo Represent2 = ${{ steps.represent2.outcome }}
          echo Rainbow = ${{ steps.rainbow.outcome }}
          echo S3Client = ${{ steps.s3client.outcome }}
          echo === san pham tim thay ===
          powershell -Command "Get-ChildItem -Recurse -Include *.exe,*.dll,*.lib -Path '%SRC%' -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt (Get-Date).AddHours(-2) } | Select-Object FullName,Length | Format-Table -AutoSize"
          echo === 40 loi dau moi log ===
          powershell -Command "Get-ChildItem *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ('##### '+$_.Name); Select-String -Path $_.FullName -Pattern 'error [A-Z]+[0-9]+' | Select-Object -First 40 | ForEach-Object { $_.Line } }"

      - name: 'Kiem tra Game.exe'
        if: always()
        continue-on-error: true
        run: |
          echo === kich thuoc san pham ===
          powershell -Command "'Game.exe','..\..\Engine\Release\Engine.dll','..\..\Core\ClientRelease\CoreClient.dll' | ForEach-Object { $p=Join-Path '%SRC%\S3Client\Release' $_; if(Test-Path $p){ $f=Get-Item $p; Write-Host ('{0,-16} {1,10:N0} bytes' -f $f.Name,$f.Length) } }"
          echo === section header cua Game.exe (kiem WinLicense/Themida) ===
          dumpbin /headers "%SRC%\S3Client\Release\Game.exe" | findstr /C:"machine" /C:"Name" /C:"subsystem"
          exit /b 0

      # ---- Bao ve ban phat hanh (TAT SAN, bat khi len production) ----
      # WinLicense KHONG phai thu vien goi trong code — no la trinh DONG GOI chay tren
      # exe da bien dich xong. Nen cho dung cua no la o day, sau khi link, truoc khi tai len.
      #
      # Chua bat vi:
      #   1. Chua co ban quyen (kho chi co SDK .lib/.h, khong co chinh trinh dong goi).
      #   2. Bat len la moi lai dung lop loi da ton nhieu cong nhat: vdk.dll cua ban dang
      #      chay bi WinLicense dong goi chinh la nguon cua c0000142.
      #   3. Exe da dong goi thi het disasm, het breakpoint, crash dump vo nghia.
      #
      # Khi co ban quyen: dat bien repo PROTECT_RELEASE=1 va secret WINLICENSE_PROJECT
      # (duong dan file .wlp), roi thay phan echo ben duoi bang lenh goi trinh dong goi.
      - name: 'Dong goi ban phat hanh (WinLicense)'
        if: vars.PROTECT_RELEASE == '1'
        run: |
          echo Chua noi trinh dong goi WinLicense.
          echo Xem docs/bao-ve-va-chong-gian-lan.md trong repo VLTK-Origin.
          exit 1

      - name: 'Tai san pham len'
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: client-binaries
          path: |
            ClientAnti_JX1/SwordOnline/Sources/S3Client/Release/Game.exe
            ClientAnti_JX1/SwordOnline/Sources/Engine/Release/Engine.dll
            ClientAnti_JX1/SwordOnline/Sources/Core/ClientRelease/CoreClient.dll
            ClientAnti_JX1/SwordOnline/Sources/Represent/Represent2/Release/Represent2.dll
            ClientAnti_JX1/SwordOnline/Sources/MultiServer/Rainbow/Release/Rainbow.dll
            ClientAnti_JX1/SwordOnline/Sources/MultiServer/Rainbow/Release/Rainbow.map
            ClientAnti_JX1/SwordOnline/Sources/Engine/Release/Engine.map
            ClientAnti_JX1/SwordOnline/Sources/Core/ClientRelease/CoreClient.map
            ClientAnti_JX1/SwordOnline/Sources/S3Client/Release/Game.map
            ClientAnti_JX1/SwordOnline/Sources/Represent/Represent2/Release/Represent2.map
          if-no-files-found: warn

      - name: Tai log len
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: '*.log'
          if-no-files-found: warn
